<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hola mundo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #f8fafc; background: linear-gradient(135deg, #0f172a, #1d4ed8); }
    main { text-align: center; padding: 2rem; }
    h1 { display: flex; justify-content: center; gap: .02em; margin: 0 0 1.5rem; font-size: clamp(2.5rem, 10vw, 5rem); }
    h1 span { display: inline-block; animation: crecer 1.8s ease-in-out infinite; animation-delay: calc(var(--i) * 90ms); }
    h1 .espacio { width: .3em; }
    @keyframes crecer { 0%, 35%, 100% { transform: scale(1); } 18% { transform: scale(1.25); } }
    button { padding: .8rem 2rem; border: 0; border-radius: .75rem; font: inherit; font-weight: 700; color: #1e3a8a; background: #fff; cursor: pointer; box-shadow: 0 .5rem 1.5rem #0004; }
    button:hover { background: #dbeafe; }
    button:active { transform: translateY(1px); }
    @media (prefers-reduced-motion: reduce) { h1 span { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1 aria-label="Hola mundo">
      <span style="--i:0" aria-hidden="true">H</span><span style="--i:1" aria-hidden="true">o</span><span style="--i:2" aria-hidden="true">l</span><span style="--i:3" aria-hidden="true">a</span><span style="--i:4" class="espacio" aria-hidden="true"></span><span style="--i:5" aria-hidden="true">m</span><span style="--i:6" aria-hidden="true">u</span><span style="--i:7" aria-hidden="true">n</span><span style="--i:8" aria-hidden="true">d</span><span style="--i:9" aria-hidden="true">o</span>
    </h1>
    <button type="button" onclick="pywebview.api.salir()">Salir</button>
  </main>
</body>
</html>
